[pytest]
# Rootdir and import mode were previously implicit, which is why some ad-hoc
# runs needed `--rootdir=.` to collect the same set. Pinning them here makes
# every invocation -- local, parallel, CI -- collect identically.
testpaths = games
norecursedirs = .venv .git target node_modules runs extension_7wd

markers =
    slow: integration tests that play real games; deselect with -m 'not slow'
    gpu: requires a CUDA device; deselect with -m 'not gpu'
    perf: measures throughput or wall-clock cost, so it needs a quiet machine

# --dist=loadfile keeps a file's tests on one worker, so module-scoped fixtures
# (the endgame corpus, the tiny checkpoints, the control table) are built once
# per file instead of once per worker that happens to draw a test from it.
# It is inert without -n, so it costs a sequential run nothing.
#
# The timeout is a diagnostic, not a deadline: no bounded test should approach
# 15 minutes, and when one does the dump names it instead of leaving a silent
# stall. On Windows there is no SIGALRM, so pytest-timeout always uses the
# thread method -- it dumps every thread's stack and then kills the PROCESS.
# Under -n that is one worker and the run continues; sequentially it ends the
# run. That is deliberate: a stall you cannot name costs more than the tests
# that would have run after it.
addopts =
    --dist=loadfile
    --timeout=900
    --timeout-method=thread
