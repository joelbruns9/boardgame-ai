[package]
name = "seven_wonders_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "seven_wonders_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
# Probe for CORE_UTILIZATION_PLAN.md step 2(a): the encoder allocates one
# Vec<f64> per token -- ~200M allocations in a 6-minute run, most holding
# between 1 and 26 values. If allocator throughput is the cost, this shows it
# with no logic change and no bit-exactness risk. Revert if the A/B is flat.
mimalloc = { version = "0.1", default-features = false }
# Row-parallel encoding (CORE_UTILIZATION_PLAN.md step 2b). Packing is the
# largest CPU term on the critical path and its rows are independent. Thread
# count is rayon's global pool, so RAYON_NUM_THREADS sweeps it without a rebuild.
rayon = "1"
sha2 = "0.10"

# Phase F1 is engine-only: no numpy/rayon/rand yet. The batched-inference and
# Gumbel searcher dependencies arrive with F3/F4. Keeping the dependency set
# minimal keeps the F1 build fast while the engine is iterated against the
# byte-exact replay gate.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
